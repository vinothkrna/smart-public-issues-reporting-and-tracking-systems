{% extends "base.html" %}

{% block title %}404 - Page Not Found | Smart Public Issues{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="glass-card p-5 rounded-4 shadow-sm">
                <div class="display-1 fw-extrabold text-primary mb-2">404</div>
                <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
                <p class="text-muted small mb-4">
                    The civic grievance record or page you requested could not be located or has been relocated.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('issue.home') }}" class="btn btn-primary-custom px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('issue.list_issues') }}" class="btn btn-outline-secondary px-3">
                        Browse Issues
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

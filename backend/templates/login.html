{% extends "base.html" %}

{% block title %}Sign In | Smart Public Issues{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5 rounded-4 shadow-lg">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.3rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-extrabold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to report complaints or manage city grievances.</p>
                </div>

                <!-- 1-Click Fast Demo Credentials Buttons -->
                <div class="demo-credentials-box mb-4">
                    <div class="fw-bold text-dark mb-2 small"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> 1-Click Quick Demo Login:</div>
                    <div class="d-flex gap-2 flex-column">
                        <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center" onclick="fillDemo('vinoth@gmail.com', '123456')">
                            <span><i class="bi bi-person-fill me-1"></i> Citizen: <strong>Vinoth Krishna</strong></span>
                            <span class="badge bg-primary">Select</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger text-start d-flex justify-content-between align-items-center" onclick="fillDemo('admin@smartcity.gov', 'admin123')">
                            <span><i class="bi bi-shield-fill-check me-1"></i> Admin: <strong>City Admin</strong></span>
                            <span class="badge bg-danger">Select</span>
                        </button>
                    </div>
                </div>

                <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" name="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck">
                            <label class="form-check-label small text-muted" for="rememberCheck">
                                Remember me
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                        Sign In &rarr;
                    </button>

                    <div class="text-center text-muted small">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Sign Up Free</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillDemo(email, pass) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
}
</script>
{% endblock %}

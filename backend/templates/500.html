{% extends "base.html" %}

{% block title %}500 - Server Error | Smart Public Issues{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="glass-card p-5 rounded-4 shadow-sm">
                <div class="display-1 fw-extrabold text-danger mb-2">500</div>
                <h4 class="fw-bold text-dark mb-2">Internal Server Error</h4>
                <p class="text-muted small mb-4">
                    An unexpected server error occurred while processing your municipal request. Our technical team has been notified.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('issue.home') }}" class="btn btn-primary-custom px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
